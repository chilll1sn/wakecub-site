name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `next build` with output:"export" writes ./out, including CNAME,
      # .nojekyll and .well-known/apple-app-site-association from public/.
      # include-hidden-files is required from v4 on, which stopped shipping
      # dotfiles by default: without it .nojekyll goes missing, Jekyll then
      # drops _next/ and the whole site loads unstyled, and the
      # .well-known/ Universal Link for friend invites stops resolving.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Tell IndexNow the pages changed, rather than waiting for a crawler to
      # come back on its own schedule. Bing, Yandex and Seznam share this one
      # endpoint. Ownership is proved by public/<key>.txt, which is served at
      # the site root and must contain the key and nothing else — which is why
      # that file carries no comment explaining itself, and this step does.
      #
      # Every deploy pings, with no check for whether the copy actually moved:
      # a static export rewrites all three documents on every build, so a
      # deploy IS the change notification. Deploys here are rare enough that
      # this is not the "don't resubmit unchanged URLs" case the spec warns of.
      #
      # `|| true` because search-engine notification is not worth failing a
      # deploy that has already succeeded — the pages are live either way.
      # The status code is printed rather than swallowed for exactly that
      # reason: the step is green whatever happens, so the log is the only
      # place a rejection can show. 200/202 is accepted, 403 means the key
      # file stopped answering at keyLocation.
      - name: Notify IndexNow
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" \
            -w "\nIndexNow returned HTTP %{http_code}\n" \
            -d '{
              "host": "wakecub.app",
              "key": "620357eb92559e15532c13f4a0e72cc4",
              "keyLocation": "https://wakecub.app/620357eb92559e15532c13f4a0e72cc4.txt",
              "urlList": [
                "https://wakecub.app/",
                "https://wakecub.app/privacy.html",
                "https://wakecub.app/terms.html"
              ]
            }' || true
