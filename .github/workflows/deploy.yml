name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `next build` with output:"export" writes ./out, including CNAME,
      # .nojekyll and .well-known/apple-app-site-association from public/.
      # include-hidden-files is required from v4 on, which stopped shipping
      # dotfiles by default: without it .nojekyll goes missing, Jekyll then
      # drops _next/ and the whole site loads unstyled, and the
      # .well-known/ Universal Link for friend invites stops resolving.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
