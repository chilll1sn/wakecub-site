<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wake cub — 真的會把你叫起來的鬧鐘</title>
<meta name="description" content="Wake cub 是一款需要完成真實任務才能關掉的 iOS 鬧鐘。刷牙、深蹲、揮拳、答題——做完才安靜。">
<style>
  :root {
    --bg: #fdfaf6; --card: #fff; --text: #1c1917; --dim: #78716c;
    --accent: #ff8c42; --line: #eee7e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --card: #221d17; --text: #f5f0ea; --dim: #a8a29e; --line: #322a22; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 56px 24px 72px; }
  .logo { font-size: 60px; line-height: 1; margin-bottom: 20px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 12px; letter-spacing: -0.02em; }
  .sub { color: var(--dim); font-size: 17px; margin: 0 0 32px; }

  .invite {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 32px; display: none;
  }
  .invite.on { display: block; }
  .invite p { margin: 0 0 12px; font-size: 15px; color: var(--dim); }
  .code {
    font-size: 32px; font-weight: 700; letter-spacing: 3px;
    color: var(--accent); font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  .hint { font-size: 13px; color: var(--dim); margin: 10px 0 0; }

  .cta {
    display: block; background: var(--accent); color: #fff; text-align: center;
    text-decoration: none; font-weight: 600; font-size: 17px;
    padding: 15px; border-radius: 13px; margin-bottom: 12px;
  }
  .soon {
    display: block; text-align: center; padding: 15px; border-radius: 13px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--dim); font-size: 15px; margin-bottom: 12px;
  }

  ul { list-style: none; padding: 0; margin: 40px 0 0; }
  li { padding: 14px 0; border-top: 1px solid var(--line); font-size: 16px; }
  li b { display: block; font-size: 15px; margin-bottom: 2px; }
  li span { color: var(--dim); font-size: 14px; }

  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--dim);
  }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<main>
  <div class="logo">🐻</div>
  <h1>真的會把你叫起來的鬧鐘</h1>
  <p class="sub">Wake cub 要你完成一件真實的事才肯安靜——刷牙、深蹲、揮拳、答題。躺著按掉是沒有用的。</p>

  <!-- Shown only when arriving from an invite link. Filled by the script below. -->
  <div class="invite" id="invite">
    <p>你的朋友邀請你一起用 Wake cub。好友代碼：</p>
    <div class="code" id="code"></div>
    <p class="hint">裝好 App 後，到「好友」分頁輸入這組代碼就能加入。</p>
  </div>

  <span class="soon">iOS App 即將上架</span>

  <ul>
    <li><b>做完任務才關得掉</b><span>相機確認你真的在刷牙、在深蹲，不是隨手滑掉。</span></li>
    <li><b>連續通知轟炸</b><span>就算 App 被殺掉也照響，睡回去沒那麼容易。</span></li>
    <li><b>和朋友一起</b><span>看到朋友還在賴床，可以直接叫他起來。起得越快分數越高。</span></li>
  </ul>

  <footer>
    <a href="https://chilll1sn.github.io/wakecub-privacy/">隱私政策</a> ·
    聯絡：ravenholo7@gmail.com
  </footer>
</main>

<script>
  // Invite links look like /i/AB12CD34. On a device with the app installed iOS
  // opens the app instead and this page is never seen; this is the fallback for
  // everyone else, so the code is at least readable rather than lost.
  var m = location.pathname.match(/^\/i\/([A-Za-z0-9]{8})\/?$/);
  if (m) {
    document.getElementById('code').textContent = m[1].toUpperCase();
    document.getElementById('invite').classList.add('on');
  }
</script>
</body>
</html>
